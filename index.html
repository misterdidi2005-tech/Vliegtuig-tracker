
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dichtstbijzijnde Vliegtuig</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 2.25rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .callsign {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }
    .distance {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .item {
      display: flex;
      flex-direction: column;
    }
    .item.full-width {
      grid-column: span 2;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .value {
      font-size: 1.35rem;
      font-weight: 600;
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="callsign" class="callsign">Zoeken...</div>
    <div id="distance" class="distance">Luchtruim scannen...</div>

    <div class="grid">
      <div class="item">
        <span class="label">Vliegtuigtype</span>
        <span id="type" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Hoogte</span>
        <span id="altitude" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Snelheid</span>
        <span id="speed" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Registratie</span>
        <span id="reg" class="value">-</span>
      </div>
      <div class="item full-width">
        <span class="label">Vertrek & Bestemming</span>
        <span id="route" class="value">-</span>
      </div>
    </div>

    <div id="status" class="status">Initialiseren...</div>
  </div>

  <script>
    // ================= CONFIGURATIE =================
    const MY_LAT = 51.206;  // Jouw breedtegraad
    const MY_LON = 4.041;   // Jouw lengtegraad
    const RADIUS_NM = 35;   // Straal in zeemijlen (~65 km)
    // ===============================================

    let lastKnownFlight = "";

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // JSONP laadfunctie: kan door mobiele browsers NOOIT geblokkeerd worden via CORS
    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'adsb_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data);
        };

        const script = document.createElement('script');
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
        script.onerror = function() {
          delete window[callbackName];
          document.body.removeChild(script);
          reject(new Error("Netwerkfout"));
        };
        document.body.appendChild(script);
      });
    }

    async function checkRoute(flightNumber) {
      if (!flightNumber || flightNumber === lastKnownFlight) return;
      lastKnownFlight = flightNumber;
      
      try {
        const target = `https://api.adsbdb.com/v0/callsign/${flightNumber}`;
        const data = await jsonp(`https://jsonp.afeld.me/?url=${encodeURIComponent(target)}`);
        const r = data.response?.flightroute;
        if (r && r.origin && r.destination) {
          const orig = r.origin.iata_code || r.origin.icao_code || r.origin.name;
          const dest = r.destination.iata_code || r.destination.icao_code || r.destination.name;
          document.getElementById('route').innerText = `${orig} ➔ ${dest}`;
          return;
        }
      } catch (e) {}
      document.getElementById('route').innerText = "Niet beschikbaar";
    }

    async function updateNearestFlight() {
      // Ophalen via JSONP gateway (geen CORS blokkade)
      const targetApi = `https://api.airplanes.live/v2/point/${MY_LAT}/${MY_LON}/${RADIUS_NM}`;
      const jsonpUrl = `https://jsonp.afeld.me/?url=${encodeURIComponent(targetApi)}`;

      try {
        const data = await jsonp(jsonpUrl);
        const aircraft = data.ac || [];

        if (aircraft.length === 0) {
          document.getElementById('callsign').innerText = "Geen verkeer";
          document.getElementById('distance').innerText = `Geen verkeer binnen ${RADIUS_NM} NM`;
          document.getElementById('type').innerText = "-";
          document.getElementById('altitude').innerText = "-";
          document.getElementById('speed').innerText = "-";
          document.getElementById('reg').innerText = "-";
          document.getElementById('route').innerText = "-";
          document.getElementById('status').innerText = `Actief aan het scannen • ${new Date().toLocaleTimeString()}`;
          return;
        }

        let nearest = null;
        let minDistance = Infinity;

        aircraft.forEach(ac => {
          if (ac.lat && ac.lon) {
            const dist = getDistanceKm(MY_LAT, MY_LON, ac.lat, ac.lon);
            if (dist < minDistance) {
              minDistance = dist;
              nearest = ac;
            }
          }
        });

        if (nearest) {
          const callsign = (nearest.flight || nearest.r || "Vlucht").trim();
          document.getElementById('callsign').innerText = callsign;
          document.getElementById('distance').innerText = `${minDistance.toFixed(1)} km van je vandaan`;
          document.getElementById('type').innerText = nearest.t || "Onbekend";

          // Hoogte
          const altFt = nearest.alt_baro === "ground" ? 0 : nearest.alt_baro;
          if (altFt !== undefined && altFt !== null) {
            const altM = Math.round(altFt * 0.3048);
            document.getElementById('altitude').innerText = `${altFt} ft (${altM} m)`;
          } else {
            document.getElementById('altitude').innerText = "-";
          }

          // Snelheid
          if (nearest.gs) {
            const kmh = Math.round(nearest.gs * 1.852);
            document.getElementById('speed').innerText = `${kmh} km/u`;
          } else {
            document.getElementById('speed').innerText = "-";
          }

          document.getElementById('reg').innerText = nearest.r || "-";

          // Route ophalen
          checkRoute(callsign);
        }

        document.getElementById('status').innerText = `Live verbonden • ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('status').innerText = `Scannen... (${new Date().toLocaleTimeString()})`;
      }
    }

    updateNearestFlight();
    setInterval(updateNearestFlight, 5000);
  </script>
</body>
</html>
