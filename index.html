<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dichtstbijzijnde Vliegtuig</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .callsign {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }
    .distance {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .item {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .value {
      font-size: 1.35rem;
      font-weight: 600;
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="callsign" class="callsign">Zoeken...</div>
    <div id="distance" class="distance">Bezig met scannen van het luchtruim...</div>

    <div class="grid">
      <div class="item">
        <span class="label">Vliegtuigtype</span>
        <span id="type" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Hoogte</span>
        <span id="altitude" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Snelheid</span>
        <span id="speed" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Registratie</span>
        <span id="reg" class="value">-</span>
      </div>
    </div>

    <div id="status" class="status">Initialiseren...</div>
  </div>

  <script>
    // ================= CONFIGURATIE =================
    const MY_LAT = 51.206;  // Jouw breedtegraad
    const MY_LON = 4.041;   // Jouw lengtegraad
    const RADIUS_NM = 30;   // Straal in zeemijlen (~55 km)
    const REFRESH_SEC = 5;  // Verversen elke 5 seconden
    // ===============================================

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function fetchFromApi() {
      // Probeert eerst airplanes.live, valt bij problemen terug op adsb.lol
      const endpoints = [
        `https://api.airplanes.live/v2/point/${MY_LAT}/${MY_LON}/${RADIUS_NM}`,
        `https://api.adsb.lol/v2/point/${MY_LAT}/${MY_LON}/${RADIUS_NM}`
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            return await res.json();
          }
        } catch (e) {
          // Volgende proberen
        }
      }
      throw new Error("Geen verbinding mogelijk");
    }

    async function updateNearestFlight() {
      try {
        const data = await fetchFromApi();
        const aircraft = data.ac || [];

        if (aircraft.length === 0) {
          document.getElementById('callsign').innerText = "Geen verkeer";
          document.getElementById('distance').innerText = `Geen vliegtuigen binnen ${RADIUS_NM} NM`;
          document.getElementById('type').innerText = "-";
          document.getElementById('altitude').innerText = "-";
          document.getElementById('speed').innerText = "-";
          document.getElementById('reg').innerText = "-";
          document.getElementById('status').innerText = `Laatste scan: ${new Date().toLocaleTimeString()}`;
          return;
        }

        let nearest = null;
        let minDistance = Infinity;

        aircraft.forEach(ac => {
          if (ac.lat && ac.lon) {
            const dist = getDistanceKm(MY_LAT, MY_LON, ac.lat, ac.lon);
            if (dist < minDistance) {
              minDistance = dist;
              nearest = ac;
            }
          }
        });

        if (nearest) {
          document.getElementById('callsign').innerText = (nearest.flight || nearest.r || "Vlucht").trim();
          document.getElementById('distance').innerText = `${minDistance.toFixed(1)} km van je vandaan`;
          document.getElementById('type').innerText = nearest.t || "Onbekend";
          
          const altFt = nearest.alt_baro === "ground" ? 0 : nearest.alt_baro;
          if (altFt !== undefined) {
            const altM = Math.round(altFt * 0.3048);
            document.getElementById('altitude').innerText = `${altFt} ft (${altM} m)`;
          } else {
            document.getElementById('altitude').innerText = "Onbekend";
          }

          if (nearest.gs) {
            const kmh = Math.round(nearest.gs * 1.852);
            document.getElementById('speed').innerText = `${kmh} km/u`;
          } else {
            document.getElementById('speed').innerText = "Onbekend";
          }

          document.getElementById('reg').innerText = nearest.r || "-";
        }

        document.getElementById('status').innerText = `Live verbonden • ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('status').innerText = "Gegevens laden...";
      }
    }

    updateNearestFlight();
    setInterval(updateNearestFlight, REFRESH_SEC * 1000);
  </script>
</body>
</html>
