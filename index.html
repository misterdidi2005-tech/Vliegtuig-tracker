<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dichtstbijzijnde Vliegtuig</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .callsign {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #38bdf8;
      margin-bottom: 0.25rem;
    }
    .distance {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 1.8rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .item {
      display: flex;
      flex-direction: column;
    }
    .label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.25rem;
    }
    .value {
      font-size: 1.35rem;
      font-weight: 600;
    }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="callsign" class="callsign">Zoeken...</div>
    <div id="distance" class="distance">Luchtruim scannen...</div>

    <div class="grid">
      <div class="item">
        <span class="label">Land van herkomst</span>
        <span id="country" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Hoogte</span>
        <span id="altitude" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Snelheid</span>
        <span id="speed" class="value">-</span>
      </div>
      <div class="item">
        <span class="label">Transponder (ICAO)</span>
        <span id="icao" class="value">-</span>
      </div>
    </div>

    <div id="status" class="status">Initialiseren...</div>
  </div>

  <script>
    // ================= CONFIGURATIE =================
    const MY_LAT = 51.206;  // Jouw breedtegraad
    const MY_LON = 4.041;   // Jouw lengtegraad
    const DELTA = 0.5;      // Zoekvak rondom je locatie (+/- 55 km)
    // ===============================================

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function updateNearestFlight() {
      // Coördinaten-kader berekenen
      const lamin = (MY_LAT - DELTA).toFixed(4);
      const lamax = (MY_LAT + DELTA).toFixed(4);
      const lomin = (MY_LON - DELTA).toFixed(4);
      const lomax = (MY_LON + DELTA).toFixed(4);

      const url = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Netwerkfout");
        const data = await res.json();
        const states = data.states || [];

        if (states.length === 0) {
          document.getElementById('callsign').innerText = "Geen verkeer";
          document.getElementById('distance').innerText = "Geen toestellen in jouw sector";
          document.getElementById('country').innerText = "-";
          document.getElementById('altitude').innerText = "-";
          document.getElementById('speed').innerText = "-";
          document.getElementById('icao').innerText = "-";
          document.getElementById('status').innerText = `Laatste scan: ${new Date().toLocaleTimeString()}`;
          return;
        }

        let nearest = null;
        let minDistance = Infinity;

        states.forEach(s => {
          const lon = s[5];
          const lat = s[6];
          const onGround = s[8];

          if (lat && lon && !onGround) {
            const dist = getDistanceKm(MY_LAT, MY_LON, lat, lon);
            if (dist < minDistance) {
              minDistance = dist;
              nearest = s;
            }
          }
        });

        if (nearest) {
          const callsign = nearest[1] ? nearest[1].trim() : "Onbekend";
          const country = nearest[2] || "-";
          const baroAltM = nearest[7]; // Hoogte in meters
          const velocityMs = nearest[9]; // Snelheid in m/s
          const icao = nearest[0].toUpperCase();

          document.getElementById('callsign').innerText = callsign !== "" ? callsign : icao;
          document.getElementById('distance').innerText = `${minDistance.toFixed(1)} km van je vandaan`;
          document.getElementById('country').innerText = country;

          if (baroAltM !== null && baroAltM !== undefined) {
            const ft = Math.round(baroAltM * 3.28084);
            document.getElementById('altitude').innerText = `${ft} ft (${Math.round(baroAltM)} m)`;
          } else {
            document.getElementById('altitude').innerText = "Onbekend";
          }

          if (velocityMs !== null && velocityMs !== undefined) {
            const kmh = Math.round(velocityMs * 3.6);
            document.getElementById('speed').innerText = `${kmh} km/u`;
          } else {
            document.getElementById('speed').innerText = "Onbekend";
          }

          document.getElementById('icao').innerText = icao;
        }

        document.getElementById('status').innerText = `Live verbonden • ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        document.getElementById('status').innerText = "Wachten op data (automatische herhaling)...";
      }
    }

    updateNearestFlight();
    // OpenSky gratis API ververst elke 10 seconden
    setInterval(updateNearestFlight, 10000);
  </script>
</body>
</html>
